# ==============================================================
#  Healthcare Automation - CI/CD Pipeline
# ==============================================================
#
#  Author: Aisha | Michael | Aida | Sunisa | Berrat | Pedro
#  Project: healthcare_automation
#  Tech Stack: Java 17 | Cucumber BDD | Maven | Selenium
#
#  --------------------------------------------------------------
#  Pipeline Overview
#  --------------------------------------------------------------
#  ✔ Build stage (fail fast compilation)
#  ✔ UI test stage (parallel execution: Chrome & Firefox)
#  ✔ Cucumber HTML / JSON / XML report artifacts
#  ✔ Nightly regression
#  ✔ Slack notifications (success & failure)
#
#  Trigger Strategy
#  --------------------------------------------------------------
#  - Pull Request  → Smoke tests only
#  - Push to master → UI suites
#  - Nightly (cron) → Full regression suite
#
#  Architecture Pattern
#  --------------------------------------------------------------
#  Build → UI Tests (Matrix) → Report → Notifications
# ==============================================================

# ==============================================================
#  Healthcare Automation - CI/CD Pipeline
# ==============================================================

name: Healthcare Automation

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

  schedule:
    - cron: '0 11 * * *'

env:
  MAVEN_OPTS: "-Xmx1024m"

jobs:

  # ==============================================================
  # 1. BUILD STAGE
  # ==============================================================
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compile Project
        run: mvn clean compile

  # ==============================================================
  # 2. UI TEST STAGE (Parallel Browsers)
  # ==============================================================
  ui-tests:
    name: UI Tests - ${{ matrix.browser }}
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Setup Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1

      - name: Setup Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Set Cucumber Tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=@smoke" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "value=@ui" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "value=@regression" >> $GITHUB_OUTPUT
          fi

      - name: Run Cucumber Tests
        run: mvn clean test -Dcucumber.filter.tags="${{ steps.tags.outputs.value }}" -Dbrowser=${{ matrix.browser }}

      - name: Upload Cucumber Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-${{ matrix.browser }}
          path: |
            target/cucumber-report/**
            target/cucumber.json
            target/cucumber.xml
            target/surefire-reports/**
          if-no-files-found: warn

  # ==============================================================
  # 3. REPORT COLLECTION
  # ==============================================================
  publish-report:
    name: Collect Cucumber Reports
    needs: ui-tests
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download Cucumber Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show downloaded files
        run: find artifacts -type f || true

      - name: Upload final bundled reports
        uses: actions/upload-artifact@v4
        with:
          name: final-cucumber-report-bundle
          path: artifacts
          if-no-files-found: warn

  # ==============================================================
  # 4. DISCORD NOTIFICATIONS
  # ==============================================================
  notify-success:
    name: Notify Success
    needs: [ui-tests, publish-report]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Send Discord Success Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set. Skipping Discord notification."
            exit 0
          fi
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "embeds": [
              {
                "title": "Healthcare Automation Pipeline",
                "description": "CI workflow completed successfully.",
                "color": 5763719,
                "fields": [
                  {"name": "Status", "value": "✅ PASSED", "inline": true},
                  {"name": "Repository", "value": "${{ github.repository }}", "inline": true},
                  {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                  {"name": "Workflow", "value": "${{ github.workflow }}", "inline": true},
                  {"name": "Event", "value": "${{ github.event_name }}", "inline": true},
                  {"name": "Actor", "value": "${{ github.actor }}", "inline": true},
                  {"name": "Run Details", "value": "[Open GitHub Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false}
                ],
                "footer": {
                  "text": "Healthcare Automation | Cucumber BDD | Selenium | Maven"
                }
              }
            ]
          }' \
          "$DISCORD_WEBHOOK_URL"

  notify-failure:
    name: Notify Failure
    needs: [ui-tests, publish-report]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Send Discord Failure Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set. Skipping Discord notification."
            exit 0
          fi
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "embeds": [
              {
                "title": "Healthcare Automation Pipeline",
                "description": "CI workflow completed with failures.",
                "color": 15548997,
                "fields": [
                  {"name": "Status", "value": "❌ FAILED", "inline": true},
                  {"name": "Repository", "value": "${{ github.repository }}", "inline": true},
                  {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                  {"name": "Workflow", "value": "${{ github.workflow }}", "inline": true},
                  {"name": "Event", "value": "${{ github.event_name }}", "inline": true},
                  {"name": "Actor", "value": "${{ github.actor }}", "inline": true},
                  {"name": "Run Details", "value": "[Open GitHub Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false}
                ],
                "footer": {
                  "text": "Healthcare Automation | Cucumber BDD | Selenium | Maven"
                }
              }
            ]
          }' \
          "$DISCORD_WEBHOOK_URL"